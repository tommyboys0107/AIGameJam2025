<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corruption Debug Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
        }
        
        .debug-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #00FF41;
            margin: 10px 0;
        }
        
        button {
            background: #00BFFF;
            color: black;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        button:hover {
            background: #00FF41;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border: 1px solid #333;
            height: 200px;
            overflow-y: scroll;
            font-size: 12px;
            margin: 10px 0;
        }
        
        .status {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        
        .status-item {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Corruption System Debug Test</h1>
    
    <div class="debug-panel">
        <h3>Game Status</h3>
        <div class="status">
            <div class="status-item">
                <div>Game Initialized: <span id="game-init">No</span></div>
            </div>
            <div class="status-item">
                <div>Corruption System: <span id="corruption-status">Not Available</span></div>
            </div>
            <div class="status-item">
                <div>Current Corruption: <span id="current-corruption">0</span></div>
            </div>
        </div>
    </div>
    
    <div class="debug-panel">
        <h3>Test Controls</h3>
        <button onclick="initializeGame()">Initialize Game</button>
        <button onclick="testCorruptionIncrease()">Test +10 Corruption</button>
        <button onclick="testCorruptionDecrease()">Test -5 Corruption</button>
        <button onclick="simulateClick()">Simulate Click (Corrupted)</button>
        <button onclick="simulateAllow()">Simulate Allow (Legitimate)</button>
        <button onclick="checkGameState()">Check Game State</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="debug-panel">
        <h3>Debug Log</h3>
        <div class="log" id="debug-log">Waiting for initialization...</div>
    </div>

    <script type="module">
        // Import game modules
        import { GameManager } from './js/managers/GameManager.js';
        import { PhaseManager } from './js/managers/PhaseManager.js';
        import { DataStreamGenerator } from './js/managers/DataStreamGenerator.js';
        import { CorruptionSystem } from './js/managers/CorruptionSystem.js';
        import { UIManager } from './js/ui/UIManager.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { SpawnSettings, PhaseSettings } from './js/core/dataClasses.js';
        
        let gameManager = null;
        let corruptionSystem = null;
        
        function log(message) {
            const logDiv = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateStatus() {
            document.getElementById('game-init').textContent = gameManager ? 'Yes' : 'No';
            document.getElementById('corruption-status').textContent = corruptionSystem ? 'Available' : 'Not Available';
            
            if (corruptionSystem) {
                const current = corruptionSystem.getCurrentCorruption();
                document.getElementById('current-corruption').textContent = current.toFixed(1);
            }
        }
        
        window.initializeGame = async function() {
            try {
                log('Initializing game systems...');
                
                // Create canvas element
                const canvas = document.createElement('canvas');
                canvas.id = 'game-canvas';
                canvas.width = 800;
                canvas.height = 600;
                canvas.style.display = 'none';
                document.body.appendChild(canvas);
                
                // Initialize systems
                const contentProvider = new ContentProvider();
                await contentProvider.loadContent();
                
                const phaseSettings = new PhaseSettings(15000, 120000, 1.2);
                const phaseManager = new PhaseManager(phaseSettings);
                
                const spawnSettings = new SpawnSettings(500, 1000, 15, 2.0);
                const dataStreamGenerator = new DataStreamGenerator(contentProvider, phaseManager, spawnSettings);
                dataStreamGenerator.setScreenDimensions(canvas.width, canvas.height);
                
                corruptionSystem = new CorruptionSystem(100);
                const uiManager = new UIManager();
                
                // Set up corruption system callbacks
                corruptionSystem.onCorruptionChange = (current, max) => {
                    log(`Corruption changed: ${current.toFixed(1)}/${max}`);
                    updateStatus();
                };
                
                corruptionSystem.onGameOver = (endType) => {
                    log(`Game Over! End Type: ${endType}`);
                };
                
                // Initialize game manager
                gameManager = new GameManager();
                gameManager.initialize({
                    phaseManager,
                    dataStreamGenerator,
                    corruptionSystem,
                    uiManager,
                    canvas
                });
                
                log('Game systems initialized successfully!');
                updateStatus();
                
            } catch (error) {
                log(`Initialization failed: ${error.message}`);
                console.error(error);
            }
        };
        
        window.testCorruptionIncrease = function() {
            if (corruptionSystem) {
                log('Testing corruption increase (+10)');
                corruptionSystem.simulateCorruption(10);
            } else {
                log('Corruption system not available');
            }
        };
        
        window.testCorruptionDecrease = function() {
            if (corruptionSystem) {
                log('Testing corruption decrease (-5)');
                corruptionSystem.simulateCorruption(-5);
            } else {
                log('Corruption system not available');
            }
        };
        
        window.simulateClick = function() {
            if (corruptionSystem) {
                log('Simulating click on corrupted object (should be correct)');
                corruptionSystem.processDecision(true, true); // blocked corrupted = correct
            } else {
                log('Corruption system not available');
            }
        };
        
        window.simulateAllow = function() {
            if (corruptionSystem) {
                log('Simulating allow legitimate object (should be correct)');
                corruptionSystem.processDecision(false, false); // allowed legitimate = correct
            } else {
                log('Corruption system not available');
            }
        };
        
        window.checkGameState = function() {
            if (gameManager && corruptionSystem) {
                const stats = corruptionSystem.getPerformanceStats();
                log(`Game State Check:`);
                log(`- Corruption: ${stats.currentCorruption.toFixed(1)}/${stats.corruptionThreshold}`);
                log(`- Accuracy: ${(stats.accuracy * 100).toFixed(1)}%`);
                log(`- Total Decisions: ${stats.totalDecisions}`);
                log(`- Correct Blocks: ${stats.correctBlocks}`);
                log(`- Missed Corrupted: ${stats.missedCorrupted}`);
                log(`- False Positives: ${stats.falsePositives}`);
            } else {
                log('Game not initialized');
            }
        };
        
        window.clearLog = function() {
            document.getElementById('debug-log').innerHTML = '';
        };
        
        // Initialize status display
        updateStatus();
        log('Debug test ready. Click "Initialize Game" to start.');
    </script>
</body>
</html>
</content>
</invoke>
