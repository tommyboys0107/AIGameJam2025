<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corruption System Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
        }
        
        .test-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 1px solid #00FF41;
            margin: 10px 0;
        }
        
        button {
            background: #00BFFF;
            color: black;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        button:hover {
            background: #00FF41;
        }
        
        .corruption-meter {
            width: 300px;
            height: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00FF41;
            margin: 10px 0;
            position: relative;
        }
        
        .corruption-fill {
            height: 100%;
            background: linear-gradient(90deg, #00FF41 0%, #FFD700 50%, #FF4500 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .corruption-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        
        .stat-item {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }
    </style>
</head>
<body>
    <h1>Corruption System Test</h1>
    
    <div class="test-panel">
        <h3>Corruption Level</h3>
        <div class="corruption-meter">
            <div class="corruption-fill" id="corruption-fill"></div>
            <div class="corruption-text" id="corruption-text">0%</div>
        </div>
        <div>Current: <span id="current-corruption">0</span> / <span id="max-corruption">100</span></div>
    </div>
    
    <div class="test-panel">
        <h3>Test Actions</h3>
        <button onclick="testCorrectBlock()">Correct Block (Corrupted)</button>
        <button onclick="testMissedCorrupted()">Miss Corrupted Content</button>
        <button onclick="testFalsePositive()">False Positive (Block Legitimate)</button>
        <button onclick="testCorrectAllow()">Correct Allow (Legitimate)</button>
        <button onclick="resetSystem()">Reset System</button>
    </div>
    
    <div class="test-panel">
        <h3>Statistics</h3>
        <div class="stats">
            <div class="stat-item">
                <div>Correct Blocks: <span id="correct-blocks">0</span></div>
            </div>
            <div class="stat-item">
                <div>Missed Corrupted: <span id="missed-corrupted">0</span></div>
            </div>
            <div class="stat-item">
                <div>False Positives: <span id="false-positives">0</span></div>
            </div>
            <div class="stat-item">
                <div>Accuracy: <span id="accuracy">0%</span></div>
            </div>
        </div>
    </div>
    
    <div class="test-panel">
        <h3>Recent Decisions</h3>
        <div id="recent-decisions">No decisions yet</div>
    </div>

    <script type="module">
        import { CorruptionSystem } from './js/managers/CorruptionSystem.js';
        
        let corruptionSystem;
        
        function updateDisplay() {
            const corruption = corruptionSystem.getCurrentCorruption();
            const percentage = corruptionSystem.getCorruptionPercentage() * 100;
            const metrics = corruptionSystem.getMetrics();
            const stats = corruptionSystem.getPerformanceStats();
            
            // Update corruption meter
            document.getElementById('corruption-fill').style.width = `${percentage}%`;
            document.getElementById('corruption-text').textContent = `${Math.round(percentage)}%`;
            document.getElementById('current-corruption').textContent = Math.round(corruption);
            document.getElementById('max-corruption').textContent = corruptionSystem.corruptionThreshold;
            
            // Update stats
            document.getElementById('correct-blocks').textContent = metrics.correctBlocks;
            document.getElementById('missed-corrupted').textContent = metrics.missedCorrupted;
            document.getElementById('false-positives').textContent = metrics.falsePositives;
            document.getElementById('accuracy').textContent = `${Math.round(metrics.accuracy * 100)}%`;
            
            // Update recent decisions
            const history = corruptionSystem.getDecisionHistory();
            const recentDiv = document.getElementById('recent-decisions');
            if (history.length === 0) {
                recentDiv.textContent = 'No decisions yet';
            } else {
                recentDiv.innerHTML = history.slice(-5).map(decision => 
                    `<div>${decision.type}: ${decision.corruptionChange > 0 ? '+' : ''}${decision.corruptionChange} (${Math.round(decision.accuracy * 100)}% accuracy)</div>`
                ).join('');
            }
            
            console.log('Corruption System Stats:', stats);
        }
        
        function init() {
            corruptionSystem = new CorruptionSystem(100);
            
            // Set up callbacks
            corruptionSystem.onCorruptionChange = (current, max) => {
                console.log(`Corruption changed: ${current}/${max}`);
                updateDisplay();
            };
            
            corruptionSystem.onGameOver = (endType) => {
                alert(`Game Over! End Type: ${endType}`);
            };
            
            corruptionSystem.onAccuracyChange = (accuracy) => {
                console.log(`Accuracy changed: ${Math.round(accuracy * 100)}%`);
            };
            
            updateDisplay();
        }
        
        // Test functions
        window.testCorrectBlock = function() {
            // Player blocked corrupted content (correct decision)
            corruptionSystem.processDecision(true, true);
        };
        
        window.testMissedCorrupted = function() {
            // Player let corrupted content through (incorrect decision)
            corruptionSystem.processDecision(false, true);
        };
        
        window.testFalsePositive = function() {
            // Player blocked legitimate content (incorrect decision)
            corruptionSystem.processDecision(true, false);
        };
        
        window.testCorrectAllow = function() {
            // Player let legitimate content through (correct decision)
            corruptionSystem.processDecision(false, false);
        };
        
        window.resetSystem = function() {
            corruptionSystem.reset();
            updateDisplay();
        };
        
        // Initialize when page loads
        init();
    </script>
</body>
</html>
</content>
