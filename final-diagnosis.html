<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Image Diagnosis</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        .test-result {
            border: 1px solid #00FF41;
            margin: 10px 0;
            padding: 15px;
        }
        .pass { border-color: #00FF41; background: rgba(0, 255, 65, 0.1); }
        .fail { border-color: #FF4444; background: rgba(255, 68, 68, 0.1); color: #FF4444; }
        .warning { border-color: #FFA500; background: rgba(255, 165, 0, 0.1); color: #FFA500; }
        
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        button:hover {
            background: #00BFFF;
        }
        
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 10px 0;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        
        .summary {
            background: rgba(0, 191, 255, 0.1);
            border: 2px solid #00BFFF;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Human Firewall - 最終圖片診斷</h1>
    
    <div class="summary" id="summary">
        點擊「開始完整診斷」來檢測圖片載入問題
    </div>
    
    <button onclick="runFullDiagnosis()">開始完整診斷</button>
    
    <div id="results"></div>
    
    <canvas id="testCanvas" width="800" height="400"></canvas>
    
    <div class="log" id="log"></div>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const logDiv = document.getElementById('log');
        const resultsDiv = document.getElementById('results');
        const summaryDiv = document.getElementById('summary');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function addResult(title, status, details) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.innerHTML = `
                <h3>${title}</h3>
                <p>${details}</p>
            `;
            resultsDiv.appendChild(div);
        }

        async function runFullDiagnosis() {
            log('🔍 開始完整診斷...');
            resultsDiv.innerHTML = '';
            
            const results = {
                serverAccess: false,
                basicImageLoad: false,
                canvasRender: false,
                moduleImport: false,
                contentProvider: false,
                gameObjects: false
            };

            // Test 1: Server Access
            log('測試 1: 伺服器存取...');
            try {
                const response = await fetch('assets/images/Safe1.jpg', { method: 'HEAD' });
                if (response.ok) {
                    results.serverAccess = true;
                    addResult('伺服器存取', 'pass', '✅ 圖片檔案可以透過 HTTP 存取');
                    log('✅ 伺服���存取正常');
                } else {
                    addResult('伺服器存取', 'fail', `❌ HTTP 回應錯誤: ${response.status}`);
                    log(`❌ HTTP 回應錯誤: ${response.status}`);
                }
            } catch (error) {
                addResult('伺服器存取', 'fail', `❌ 網路錯誤: ${error.message}`);
                log(`❌ 網路錯誤: ${error.message}`);
            }

            // Test 2: Basic Image Loading
            log('測試 2: 基本圖片載入...');
            try {
                const img = await loadImage('assets/images/Safe1.jpg');
                results.basicImageLoad = true;
                addResult('基本圖片載入', 'pass', `✅ 圖片載入成功 (${img.width}x${img.height})`);
                log(`✅ 基本圖片載入成功: ${img.width}x${img.height}`);
            } catch (error) {
                addResult('基本圖片載入', 'fail', `❌ 圖片載入失敗: ${error.message}`);
                log(`❌ 基本圖片載入失敗: ${error.message}`);
            }

            // Test 3: Canvas Rendering
            log('測試 3: Canvas 渲染...');
            try {
                const img = await loadImage('assets/images/Safe1.jpg');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 10, 10, 200, 150);
                
                ctx.fillStyle = '#00FF41';
                ctx.font = '16px Courier New';
                ctx.fillText('Canvas 渲染測試成功', 10, 180);
                
                results.canvasRender = true;
                addResult('Canvas 渲染', 'pass', '✅ 圖片可以在 Canvas 上正確渲染');
                log('✅ Canvas 渲染成功');
            } catch (error) {
                addResult('Canvas 渲染', 'fail', `❌ Canvas 渲染失敗: ${error.message}`);
                log(`❌ Canvas 渲染失敗: ${error.message}`);
            }

            // Test 4: Module Import
            log('測試 4: 模組匯入...');
            try {
                const { GamePhase, ContentType } = await import('./js/core/constants.js');
                const { ContentProvider } = await import('./js/content/ContentProvider.js');
                const { InformationObject } = await import('./js/core/InformationObject.js');
                
                results.moduleImport = true;
                addResult('模組匯入', 'pass', '✅ 所有遊戲模組可以正確匯入');
                log('✅ 模組匯入成功');
                
                // Test 5: ContentProvider
                log('測試 5: ContentProvider...');
                try {
                    const contentProvider = new ContentProvider();
                    await contentProvider.loadContent();
                    
                    if (contentProvider.isContentLoaded()) {
                        const imageContent = contentProvider.getRandomContent(GamePhase.ART, false);
                        results.contentProvider = true;
                        addResult('ContentProvider', 'pass', `✅ ContentProvider 正常運作，圖片路徑: ${imageContent.contentImage}`);
                        log(`✅ ContentProvider 正常，圖片: ${imageContent.contentImage}`);
                        
                        // Test 6: Game Objects
                        log('測試 6: 遊戲物件...');
                        try {
                            const obj = new InformationObject(imageContent, 250, 10, 0);
                            
                            // Wait for image to load
                            setTimeout(() => {
                                if (obj.imageLoaded) {
                                    results.gameObjects = true;
                                    addResult('遊戲物件', 'pass', '✅ InformationObject 可以正確載入和渲染圖片');
                                    log('✅ 遊戲物件圖片載入成功');
                                    
                                    // Render the object
                                    obj.render(ctx);
                                    ctx.fillStyle = '#00FF41';
                                    ctx.font = '14px Courier New';
                                    ctx.fillText('遊戲物件渲染測試', 250, 160);
                                } else {
                                    addResult('遊戲物件', 'fail', '❌ InformationObject 圖片載入失敗');
                                    log('❌ 遊戲物件圖片載入失敗');
                                }
                                
                                // Final summary
                                generateSummary(results);
                            }, 3000);
                            
                        } catch (error) {
                            addResult('遊戲物件', 'fail', `❌ InformationObject 創建失敗: ${error.message}`);
                            log(`❌ 遊戲物件創建失敗: ${error.message}`);
                            generateSummary(results);
                        }
                        
                    } else {
                        addResult('ContentProvider', 'fail', '❌ ContentProvider 載入失敗');
                        log('❌ ContentProvider 載入失敗');
                        generateSummary(results);
                    }
                } catch (error) {
                    addResult('ContentProvider', 'fail', `❌ ContentProvider 錯誤: ${error.message}`);
                    log(`❌ ContentProvider 錯誤: ${error.message}`);
                    generateSummary(results);
                }
                
            } catch (error) {
                addResult('模組匯入', 'fail', `❌ 模組匯入失敗: ${error.message}`);
                log(`❌ 模組匯入失敗: ${error.message}`);
                generateSummary(results);
            }
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`Failed to load ${src}`));
                img.src = src;
            });
        }

        function generateSummary(results) {
            const passedTests = Object.values(results).filter(r => r).length;
            const totalTests = Object.keys(results).length;
            
            let summaryText = `診斷完成: ${passedTests}/${totalTests} 項測試通過\n\n`;
            
            if (passedTests === totalTests) {
                summaryText += '🎉 所有測試都通過！圖片載入系統正常運作。\n問題可能在於：\n• 遊戲邏輯中的時機問題\n• 階段切換邏輯\n• 物件生成頻率';
                summaryDiv.className = 'summary pass';
            } else if (passedTests === 0) {
                summaryText += '🚨 所有測試都失敗！\n可能的問題：\n• 伺服器未啟動\n• 檔案路徑錯誤\n• CORS 政策問題';
                summaryDiv.className = 'summary fail';
            } else {
                summaryText += '⚠️ 部分測試失敗\n請檢查失敗的項目以確定問題所在';
                summaryDiv.className = 'summary warning';
            }
            
            summaryDiv.textContent = summaryText;
            log(`📊 診斷摘要: ${passedTests}/${totalTests} 通過`);
        }

        window.runFullDiagnosis = runFullDiagnosis;
        
        log('🔧 最終診斷工具準備完成');
    </script>
</body>
</html>
