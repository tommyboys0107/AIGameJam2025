<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fix Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .result {
            background: rgba(0, 255, 65, 0.1);
            border: 2px solid #00FF41;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            font-size: 24px;
        }
        .result.success {
            border-color: #00FF41;
            background: rgba(0, 255, 65, 0.2);
        }
        .result.error {
            border-color: #FF4444;
            background: rgba(255, 68, 68, 0.2);
            color: #FF4444;
        }
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 18px;
        }
        button:hover {
            background: #00BFFF;
        }
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>最終修復測試</h1>
    
    <div class="result" id="result">
        準備測試圖片載入修復...
    </div>
    
    <button onclick="runFinalTest()">執行最終測試</button>
    
    <canvas id="canvas" width="800" height="600"></canvas>

    <script type="module">
        import { GamePhase, ContentType } from './js/core/constants.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { InformationObject } from './js/core/InformationObject.js';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');

        function showResult(message, isSuccess = true) {
            resultDiv.textContent = message;
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            console.log(message);
        }

        window.runFinalTest = async function() {
            showResult('🔄 開始最終測試...');
            
            try {
                // 清除畫布
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 1. 載入 ContentProvider
                showResult('📄 載入內容提供者...');
                const contentProvider = new ContentProvider();
                await contentProvider.loadContent();
                
                if (!contentProvider.isContentLoaded()) {
                    throw new Error('ContentProvider 載入失敗');
                }
                
                // 2. 創建多個測試物件
                showResult('🖼️ 創建測試物件...');
                const objects = [];
                
                // 創建 4 個安全圖片物件
                for (let i = 0; i < 4; i++) {
                    const content = contentProvider.getRandomContent(GamePhase.ART, false);
                    const obj = new InformationObject(content, 50 + (i % 2) * 350, 50 + Math.floor(i / 2) * 200, 0);
                    objects.push({ obj, type: '安全', index: i + 1 });
                }
                
                // 創建 4 個損壞圖片物件
                for (let i = 0; i < 4; i++) {
                    const content = contentProvider.getRandomContent(GamePhase.ART, true);
                    const obj = new InformationObject(content, 50 + (i % 2) * 350, 300 + Math.floor(i / 2) * 200, 0);
                    objects.push({ obj, type: '損壞', index: i + 5 });
                }
                
                showResult('⏳ 等待圖片載入...');
                
                // 3. 監控載入進度
                let checkCount = 0;
                const maxChecks = 100; // 10秒
                
                const monitor = setInterval(() => {
                    checkCount++;
                    
                    // 清除畫布
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 渲染所有物件
                    objects.forEach(({ obj, type, index }) => {
                        obj.render(ctx);
                        
                        // 添加標籤
                        ctx.fillStyle = obj.imageLoaded ? '#00FF41' : '#FFA500';
                        ctx.font = '14px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText(
                            `${index}. ${type} ${obj.imageLoaded ? '✅' : '⏳'}`,
                            obj.x + obj.width / 2,
                            obj.y - 10
                        );
                    });
                    
                    // 顯示統計
                    const loadedCount = objects.filter(({ obj }) => obj.imageLoaded).length;
                    const totalCount = objects.length;
                    
                    ctx.fillStyle = '#00BFFF';
                    ctx.font = '20px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(`載入進度: ${loadedCount}/${totalCount}`, 20, 40);
                    ctx.fillText(`檢查次數: ${checkCount}/${maxChecks}`, 20, 70);
                    
                    // 檢查完成條件
                    if (loadedCount === totalCount || checkCount >= maxChecks) {
                        clearInterval(monitor);
                        
                        const successRate = (loadedCount / totalCount * 100).toFixed(1);
                        
                        if (loadedCount === totalCount) {
                            showResult(`🎉 完美成功！所有 ${totalCount} 張圖片都已載入 (100%)`);
                            
                            // 顯示成功訊息
                            ctx.fillStyle = '#00FF41';
                            ctx.font = '32px Courier New';
                            ctx.textAlign = 'center';
                            ctx.fillText('圖片載入修復成功！', canvas.width / 2, canvas.height - 50);
                            
                        } else if (loadedCount > totalCount * 0.5) {
                            showResult(`✅ 大部分成功！${loadedCount}/${totalCount} 張圖片載入 (${successRate}%)`);
                            
                        } else if (loadedCount > 0) {
                            showResult(`⚠️ 部分成功：${loadedCount}/${totalCount} 張圖片載入 (${successRate}%)`, false);
                            
                        } else {
                            showResult('❌ 測試失敗：沒有圖片成功載入', false);
                        }
                        
                        // 顯示詳細結果
                        ctx.fillStyle = loadedCount > 0 ? '#00FF41' : '#FF4444';
                        ctx.font = '18px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText(
                            `最終結果: ${loadedCount}/${totalCount} 圖片載入成功`,
                            canvas.width / 2,
                            canvas.height - 20
                        );
                    }
                }, 100);
                
            } catch (error) {
                showResult(`❌ 測試失敗: ${error.message}`, false);
                console.error('Final test error:', error);
            }
        };

        // 自動開始測試
        setTimeout(() => {
            showResult('🚀 準備就緒，點擊按鈕開始測試');
        }, 1000);
    </script>
</body>
</html>
