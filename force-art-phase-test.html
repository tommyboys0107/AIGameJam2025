<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Art Phase Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 10px 0;
        }
        .controls {
            margin: 10px 0;
        }
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:hover {
            background: #00BFFF;
        }
        .log {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00FF41;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Human Firewall - Force Art Phase Test</h1>
    
    <div class="controls">
        <button onclick="startTest()">Start Art Phase Test</button>
        <button onclick="spawnSafeImage()">Spawn Safe Image</button>
        <button onclick="spawnCorruptedImage()">Spawn Corrupted Image</button>
        <button onclick="clearCanvas()">Clear Canvas</button>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div>
        <h3>Log Output</h3>
        <div id="logOutput" class="log"></div>
    </div>

    <script type="module">
        import { GamePhase, ContentType } from './js/core/constants.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { InformationObject } from './js/core/InformationObject.js';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const logOutput = document.getElementById('logOutput');

        let contentProvider = null;
        let objects = [];

        function log(message, isError = false) {
            console.log(message);
            const div = document.createElement('div');
            div.style.color = isError ? '#FF4444' : '#00FF41';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        async function initializeContentProvider() {
            log('Initializing ContentProvider...');
            contentProvider = new ContentProvider();
            
            try {
                await contentProvider.loadContent();
                log('✓ ContentProvider loaded successfully');
                return true;
            } catch (error) {
                log(`✗ ContentProvider failed to load: ${error.message}`, true);
                return false;
            }
        }

        function spawnImageObject(isCorrupted = false) {
            if (!contentProvider || !contentProvider.isContentLoaded()) {
                log('ContentProvider not ready!', true);
                return null;
            }

            log(`Spawning ${isCorrupted ? 'corrupted' : 'safe'} image...`);

            try {
                // Get content for ART phase
                const contentData = contentProvider.getRandomContent(GamePhase.ART, isCorrupted);
                
                if (!contentData) {
                    log('Failed to get content data!', true);
                    return null;
                }

                log(`Got content data: ${JSON.stringify({
                    type: contentData.contentType,
                    image: contentData.contentImage,
                    corrupted: contentData.isCorrupted
                })}`);

                // Create object at random position
                const x = Math.random() * (canvas.width - 280);
                const y = Math.random() * (canvas.height - 140);
                
                const obj = new InformationObject(contentData, x, y, 0); // No movement for testing
                objects.push(obj);
                
                log(`✓ Created InformationObject at (${x.toFixed(0)}, ${y.toFixed(0)})`);
                return obj;
                
            } catch (error) {
                log(`✗ Error spawning image: ${error.message}`, true);
                return null;
            }
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render all objects
            objects.forEach((obj, index) => {
                if (obj.isObjectActive()) {
                    obj.render(ctx);
                    
                    // Add debug label
                    ctx.fillStyle = '#00FF41';
                    ctx.font = '12px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(
                        `${index}: ${obj.isCorrupted ? 'CORRUPT' : 'SAFE'} - ${obj.imageLoaded ? 'LOADED' : 'LOADING'}`,
                        obj.x,
                        obj.y - 5
                    );
                }
            });

            // Show object count
            ctx.fillStyle = '#00BFFF';
            ctx.font = '16px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`Objects: ${objects.length}`, 10, 30);
        }

        function animate() {
            render();
            requestAnimationFrame(animate);
        }

        // Global functions for buttons
        window.startTest = async function() {
            log('Starting Art Phase Test...');
            
            if (!contentProvider) {
                const success = await initializeContentProvider();
                if (!success) {
                    log('Cannot start test - ContentProvider failed to initialize', true);
                    return;
                }
            }

            // Clear existing objects
            objects = [];
            
            // Spawn a few test images
            spawnImageObject(false); // Safe
            spawnImageObject(true);  // Corrupted
            spawnImageObject(false); // Safe
            
            log('Test started - check canvas for images');
        };

        window.spawnSafeImage = function() {
            spawnImageObject(false);
        };

        window.spawnCorruptedImage = function() {
            spawnImageObject(true);
        };

        window.clearCanvas = function() {
            objects = [];
            log('Canvas cleared');
        };

        // Start animation loop
        animate();
        
        // Auto-initialize on load
        log('Page loaded - click "Start Art Phase Test" to begin');
    </script>
</body>
</html>
