<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Flow Image Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        .panel {
            border: 1px solid #00FF41;
            margin: 10px 0;
            padding: 15px;
        }
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:hover {
            background: #00BFFF;
        }
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 10px 0;
        }
        .log {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00FF41;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .phase-info {
            background: rgba(0, 191, 255, 0.1);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00BFFF;
        }
    </style>
</head>
<body>
    <h1>Game Flow Image Test - 模擬完整遊戲流程</h1>
    
    <div class="panel">
        <h3>測試控制</h3>
        <button onclick="startFullTest()">開始完整測試</button>
        <button onclick="forceArtPhase()">強制切換到 ART 階段</button>
        <button onclick="spawnTestImages()">生成測試圖片</button>
        <button onclick="clearAll()">清除所有</button>
    </div>
    
    <div class="panel">
        <h3>階段資訊</h3>
        <div class="phase-info" id="phaseInfo">
            當前階段: <span id="currentPhase">未開始</span><br>
            階段編號: <span id="phaseNumber">0</span><br>
            難度倍數: <span id="difficulty">1.0</span>
        </div>
    </div>
    
    <div class="panel">
        <h3>遊戲畫布</h3>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    
    <div class="panel">
        <h3>測試日誌</h3>
        <div id="testLog" class="log"></div>
    </div>

    <script type="module">
        import { GamePhase, ContentType } from './js/core/constants.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { InformationObject } from './js/core/InformationObject.js';
        import { PhaseManager } from './js/managers/PhaseManager.js';
        import { PhaseSettings } from './js/core/dataClasses.js';
        import { DataStreamGenerator } from './js/managers/DataStreamGenerator.js';
        import { SpawnSettings } from './js/core/dataClasses.js';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const logDiv = document.getElementById('testLog');

        let contentProvider = null;
        let phaseManager = null;
        let dataStreamGenerator = null;
        let gameObjects = [];
        let animationId = null;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.style.color = type === 'error' ? '#FF4444' : type === 'success' ? '#00FF41' : type === 'warning' ? '#FFA500' : '#00FF41';
            div.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updatePhaseDisplay() {
            if (phaseManager) {
                const stats = phaseManager.getPhaseStats();
                document.getElementById('currentPhase').textContent = stats.currentPhase.toUpperCase();
                document.getElementById('phaseNumber').textContent = stats.phaseNumber;
                document.getElementById('difficulty').textContent = stats.difficultyMultiplier.toFixed(2);
            }
        }

        async function initializeSystems() {
            log('🔄 初始化系統...');
            
            try {
                // 1. Initialize ContentProvider
                log('📄 初始化 ContentProvider...');
                contentProvider = new ContentProvider();
                await contentProvider.loadContent();
                log('✅ ContentProvider 初始化完成', 'success');

                // 2. Initialize PhaseManager
                log('⏱️ 初始化 PhaseManager...');
                const phaseSettings = new PhaseSettings(10000, 120000, 1.2); // 10秒階段
                phaseManager = new PhaseManager(phaseSettings);
                
                phaseManager.onPhaseChange = (phase, phaseNumber, difficulty) => {
                    log(`🔄 階段變更: ${phase.toUpperCase()} (${phaseNumber}), 難度: ${difficulty.toFixed(2)}`, 'warning');
                    updatePhaseDisplay();
                    
                    // 如果切換到 ART 階段，自動生成圖片
                    if (phase === GamePhase.ART) {
                        setTimeout(() => {
                            spawnTestImages();
                        }, 500);
                    }
                };
                
                log('✅ PhaseManager 初始化完成', 'success');

                // 3. Initialize DataStreamGenerator
                log('🌊 初始化 DataStreamGenerator...');
                const spawnSettings = new SpawnSettings(1000, 2000, 8, 1.0);
                dataStreamGenerator = new DataStreamGenerator(contentProvider, phaseManager, spawnSettings);
                dataStreamGenerator.setScreenDimensions(canvas.width, canvas.height);
                log('✅ DataStreamGenerator 初始化完成', 'success');

                return true;
            } catch (error) {
                log(`❌ 系統初始化失敗: ${error.message}`, 'error');
                return false;
            }
        }

        window.startFullTest = async function() {
            log('🚀 開始完整測試...');
            
            const success = await initializeSystems();
            if (!success) {
                log('❌ 無法開始測試 - 系統初始化失敗', 'error');
                return;
            }

            // 開始階段管理
            phaseManager.startGame();
            log('✅ 遊戲開始', 'success');
            updatePhaseDisplay();

            // 開始動畫循環
            startAnimation();
        };

        window.forceArtPhase = function() {
            if (!phaseManager) {
                log('❌ PhaseManager 未初始化', 'error');
                return;
            }

            log('🎨 強制切換到 ART 階段...');
            phaseManager.forcePhase(GamePhase.ART);
            updatePhaseDisplay();
        };

        window.spawnTestImages = function() {
            if (!contentProvider || !contentProvider.isContentLoaded()) {
                log('❌ ContentProvider 未準備好', 'error');
                return;
            }

            log('🖼️ 生成測試圖片...');
            
            // 清除現有物件
            gameObjects = [];

            try {
                // 生成 4 個測試物件
                for (let i = 0; i < 4; i++) {
                    const isCorrupted = i % 2 === 1; // 交替生成安全和損壞的圖片
                    const contentData = contentProvider.getRandomContent(GamePhase.ART, isCorrupted);
                    
                    const x = 50 + (i % 2) * 350;
                    const y = 50 + Math.floor(i / 2) * 200;
                    
                    const obj = new InformationObject(contentData, x, y, 0); // 不移動
                    gameObjects.push(obj);
                    
                    log(`📦 創建物件 ${i + 1}: ${isCorrupted ? '損壞' : '安全'} - ${contentData.contentImage}`);
                }
                
                log(`✅ 成功創建 ${gameObjects.length} 個測試物件`, 'success');
                
            } catch (error) {
                log(`❌ 生成測試圖片失敗: ${error.message}`, 'error');
            }
        };

        window.clearAll = function() {
            gameObjects = [];
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            log('🧹 已清除所有內容');
        };

        function startAnimation() {
            function animate() {
                // 清除畫布
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 渲染所有物件
                gameObjects.forEach((obj, index) => {
                    if (obj.isObjectActive()) {
                        obj.render(ctx);
                        
                        // 添加調試資訊
                        ctx.fillStyle = '#00FF41';
                        ctx.font = '12px Courier New';
                        ctx.textAlign = 'left';
                        ctx.fillText(
                            `${index + 1}: ${obj.isCorrupted ? '損壞' : '安全'} - ${obj.imageLoaded ? '已載入' : '載入中'}`,
                            obj.x,
                            obj.y - 15
                        );
                        
                        // 顯示圖片路徑
                        ctx.fillStyle = '#888';
                        ctx.font = '10px Courier New';
                        ctx.fillText(
                            obj.contentImage || '無路徑',
                            obj.x,
                            obj.y + obj.height + 15
                        );
                    }
                });

                // 顯示統計資訊
                ctx.fillStyle = '#00BFFF';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText(`物件數量: ${gameObjects.length}`, 10, 30);
                
                if (gameObjects.length > 0) {
                    const loadedCount = gameObjects.filter(obj => obj.imageLoaded).length;
                    ctx.fillText(`已載入: ${loadedCount}/${gameObjects.length}`, 10, 50);
                }

                // 更新階段管理器
                if (phaseManager) {
                    phaseManager.update();
                }

                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }

        log('🎮 遊戲流程圖片測試準備完成');
        log('💡 點擊「開始完整測試」來模擬完整的遊戲初始化流程');
    </script>
</body>
</html>
