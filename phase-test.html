<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Test - Text & Art Only</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
        }
        
        .test-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #00FF41;
            margin: 10px 0;
        }
        
        button {
            background: #00BFFF;
            color: black;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        button:hover {
            background: #00FF41;
        }
        
        .phase-display {
            font-size: 24px;
            text-align: center;
            padding: 20px;
            border: 2px solid #00BFFF;
            margin: 20px 0;
            background: rgba(0, 191, 255, 0.1);
        }
        
        .phase-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        
        .info-item {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            text-align: center;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border: 1px solid #333;
            height: 150px;
            overflow-y: scroll;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Phase System Test - Text & Art Only</h1>
    
    <div class="phase-display">
        <div>Current Phase: <span id="current-phase">TEXT</span></div>
        <div>Phase Number: <span id="phase-number">1</span></div>
        <div>Difficulty: <span id="difficulty">1.0</span></div>
    </div>
    
    <div class="test-panel">
        <h3>Phase Information</h3>
        <div class="phase-info">
            <div class="info-item">
                <div>Phase Duration: <span id="phase-duration">15s</span></div>
            </div>
            <div class="info-item">
                <div>Time Remaining: <span id="time-remaining">15s</span></div>
            </div>
            <div class="info-item">
                <div>Total Elapsed: <span id="total-elapsed">0s</span></div>
            </div>
        </div>
    </div>
    
    <div class="test-panel">
        <h3>Test Controls</h3>
        <button onclick="initializePhaseManager()">Initialize Phase Manager</button>
        <button onclick="startGame()">Start Game</button>
        <button onclick="forceAdvancePhase()">Force Advance Phase</button>
        <button onclick="pauseGame()">Pause</button>
        <button onclick="resumeGame()">Resume</button>
        <button onclick="stopGame()">Stop</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="test-panel">
        <h3>Available Phases</h3>
        <div>TEXT: 文案內容階段</div>
        <div>ART: 美術圖片階段</div>
        <div style="color: #666; text-decoration: line-through;">CODE: 程式碼階段 (已移除)</div>
    </div>
    
    <div class="test-panel">
        <h3>Debug Log</h3>
        <div class="log" id="debug-log">Waiting for initialization...</div>
    </div>

    <script type="module">
        import { PhaseManager } from './js/managers/PhaseManager.js';
        import { GamePhase } from './js/core/constants.js';
        import { PhaseSettings } from './js/core/dataClasses.js';
        
        let phaseManager = null;
        let updateInterval = null;
        
        function log(message) {
            const logDiv = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateDisplay() {
            if (!phaseManager) return;
            
            const stats = phaseManager.getPhaseStats();
            
            document.getElementById('current-phase').textContent = stats.currentPhase.toUpperCase();
            document.getElementById('phase-number').textContent = stats.phaseNumber;
            document.getElementById('difficulty').textContent = stats.difficultyMultiplier.toFixed(2);
            document.getElementById('time-remaining').textContent = Math.ceil(stats.phaseTimeRemaining / 1000) + 's';
            document.getElementById('total-elapsed').textContent = Math.ceil(stats.totalElapsedTime / 1000) + 's';
        }
        
        window.initializePhaseManager = function() {
            try {
                log('Initializing Phase Manager...');
                
                // Create phase settings (shorter duration for testing)
                const settings = new PhaseSettings(10000, 120000, 1.3); // 10 second phases
                phaseManager = new PhaseManager(settings);
                
                // Set up callbacks
                phaseManager.onPhaseChange = (phase, phaseNumber, difficulty) => {
                    log(`Phase changed: ${phase.toUpperCase()} (${phaseNumber}) - Difficulty: ${difficulty.toFixed(2)}`);
                    updateDisplay();
                };
                
                phaseManager.onDifficultyIncrease = (difficulty) => {
                    log(`Difficulty increased: ${difficulty.toFixed(2)}`);
                };
                
                log('Phase Manager initialized successfully!');
                log(`Available phases: ${Object.values(GamePhase).join(', ').toUpperCase()}`);
                updateDisplay();
                
            } catch (error) {
                log(`Initialization failed: ${error.message}`);
                console.error(error);
            }
        };
        
        window.startGame = function() {
            if (!phaseManager) {
                log('Phase Manager not initialized');
                return;
            }
            
            log('Starting game...');
            phaseManager.startGame();
            
            // Start update loop
            if (updateInterval) {
                clearInterval(updateInterval);
            }
            
            updateInterval = setInterval(() => {
                phaseManager.update();
                updateDisplay();
                
                // Check if game time expired
                if (phaseManager.isGameTimeExpired()) {
                    log('Game time expired!');
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
            }, 100);
            
            log('Game started!');
        };
        
        window.forceAdvancePhase = function() {
            if (!phaseManager) {
                log('Phase Manager not initialized');
                return;
            }
            
            log('Force advancing phase...');
            phaseManager.advancePhase();
        };
        
        window.pauseGame = function() {
            if (!phaseManager) {
                log('Phase Manager not initialized');
                return;
            }
            
            log('Pausing game...');
            phaseManager.pause();
        };
        
        window.resumeGame = function() {
            if (!phaseManager) {
                log('Phase Manager not initialized');
                return;
            }
            
            log('Resuming game...');
            phaseManager.resume();
        };
        
        window.stopGame = function() {
            if (!phaseManager) {
                log('Phase Manager not initialized');
                return;
            }
            
            log('Stopping game...');
            phaseManager.stop();
            
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        };
        
        window.clearLog = function() {
            document.getElementById('debug-log').innerHTML = '';
        };
        
        // Initialize display
        log('Phase test ready. Click "Initialize Phase Manager" to start.');
    </script>
</body>
</html>
</content>
