<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Art Phase Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 20px 0;
        }
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        button:hover {
            background: #00BFFF;
        }
        .info {
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #00FF41;
        }
    </style>
</head>
<body>
    <h1>Quick Art Phase Test</h1>
    
    <div class="info">
        <p>這個測試會直接載入圖片並在 Canvas 上顯示，跳過複雜的遊戲邏輯。</p>
        <p>如果這裡的圖片能正常顯示，問題就在遊戲的其他部分。</p>
    </div>
    
    <button onclick="testDirectImages()">測試直接圖片載入</button>
    <button onclick="testGameObjects()">測試遊戲物件</button>
    <button onclick="clearCanvas()">清除畫布</button>
    
    <canvas id="testCanvas" width="800" height="600"></canvas>
    
    <div id="log" style="background: rgba(0,0,0,0.8); padding: 10px; margin: 10px 0; border: 1px solid #333; height: 200px; overflow-y: scroll; font-size: 12px;"></div>

    <script type="module">
        import { GamePhase, ContentType } from './js/core/constants.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { InformationObject } from './js/core/InformationObject.js';
        import { InformationObjectData } from './js/core/dataClasses.js';

        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const logDiv = document.getElementById('log');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // Test direct image loading
        window.testDirectImages = async function() {
            log('=== 測試直接圖片載入 ===');
            
            const images = [
                { path: 'assets/images/Safe1.jpg', x: 50, y: 50, label: 'Safe1' },
                { path: 'assets/images/Safe2.jpg', x: 300, y: 50, label: 'Safe2' },
                { path: 'assets/images/Corrupted1.jpg', x: 50, y: 200, label: 'Corrupted1' },
                { path: 'assets/images/Corrupted2.jpg', x: 300, y: 200, label: 'Corrupted2' }
            ];

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const imgData of images) {
                try {
                    const img = new Image();
                    
                    img.onload = function() {
                        log(`✅ ${imgData.label} 載入成功 (${this.width}x${this.height})`);
                        
                        // Draw image
                        const drawWidth = 200;
                        const drawHeight = 120;
                        ctx.drawImage(this, imgData.x, imgData.y, drawWidth, drawHeight);
                        
                        // Add label
                        ctx.fillStyle = '#00FF41';
                        ctx.font = '14px Courier New';
                        ctx.fillText(imgData.label, imgData.x, imgData.y - 10);
                        
                        // Add border
                        ctx.strokeStyle = '#00BFFF';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(imgData.x, imgData.y, drawWidth, drawHeight);
                    };
                    
                    img.onerror = function() {
                        log(`❌ ${imgData.label} 載入失敗`);
                        
                        // Draw error placeholder
                        ctx.fillStyle = '#FF4444';
                        ctx.fillRect(imgData.x, imgData.y, 200, 120);
                        ctx.fillStyle = '#FFF';
                        ctx.font = '16px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText('載入失敗', imgData.x + 100, imgData.y + 60);
                        ctx.textAlign = 'left';
                    };
                    
                    log(`🔄 開始載入 ${imgData.label}...`);
                    img.src = imgData.path;
                    
                } catch (error) {
                    log(`❌ ${imgData.label} 發生錯誤: ${error.message}`);
                }
            }
        };

        // Test game objects
        window.testGameObjects = async function() {
            log('=== 測試遊戲物件 ===');
            
            try {
                // Initialize ContentProvider
                log('🔄 初始化 ContentProvider...');
                const contentProvider = new ContentProvider();
                await contentProvider.loadContent();
                log('✅ ContentProvider 初始化完成');

                // Clear canvas
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Create test objects
                const objects = [];
                
                // Safe image object
                const safeData = contentProvider.getRandomContent(GamePhase.ART, false);
                const safeObj = new InformationObject(safeData, 50, 350, 0);
                objects.push({ obj: safeObj, label: 'Safe Object' });
                log(`🖼️ 創建安全物件: ${safeData.contentImage}`);

                // Corrupted image object
                const corruptedData = contentProvider.getRandomContent(GamePhase.ART, true);
                const corruptedObj = new InformationObject(corruptedData, 350, 350, 0);
                objects.push({ obj: corruptedObj, label: 'Corrupted Object' });
                log(`🖼️ 創建損壞物件: ${corruptedData.contentImage}`);

                // Render objects periodically to show loading progress
                let renderCount = 0;
                const renderInterval = setInterval(() => {
                    renderCount++;
                    
                    // Clear canvas
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Render objects
                    objects.forEach(({ obj, label }) => {
                        obj.render(ctx);
                        
                        // Add debug info
                        ctx.fillStyle = '#00FF41';
                        ctx.font = '12px Courier New';
                        ctx.textAlign = 'left';
                        ctx.fillText(
                            `${label}: ${obj.imageLoaded ? '已載入' : '載入中...'}`,
                            obj.x,
                            obj.y - 10
                        );
                    });
                    
                    // Add render count
                    ctx.fillStyle = '#00BFFF';
                    ctx.font = '16px Courier New';
                    ctx.fillText(`渲染次數: ${renderCount}`, 10, 30);
                    
                    // Stop after 10 seconds
                    if (renderCount > 100) {
                        clearInterval(renderInterval);
                        log('🔄 渲染測試完成');
                        
                        const loadedCount = objects.filter(({ obj }) => obj.imageLoaded).length;
                        log(`📊 結果: ${loadedCount}/${objects.length} 個物件成功載入圖片`);
                    }
                }, 100);

            } catch (error) {
                log(`❌ 遊戲物件測試失敗: ${error.message}`);
            }
        };

        window.clearCanvas = function() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            log('🧹 畫布已清除');
        };

        log('🚀 快速藝術階段測試準備完成');
        log('💡 建議先測試「直接圖片載入」，如果成功再測試「遊戲物件」');
    </script>
</body>
</html>
