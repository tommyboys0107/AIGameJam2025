<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Fix Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        button {
            background: #00FF41;
            color: #000;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        button:hover {
            background: #00BFFF;
        }
        canvas {
            border: 2px solid #00BFFF;
            display: block;
            margin: 20px 0;
        }
        .status {
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #00FF41;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>快速修復測試</h1>
    
    <div class="status" id="status">點擊按鈕開始測試...</div>
    
    <button onclick="runQuickTest()">執行快速測試</button>
    <button onclick="enableDebug()">啟用調試模式</button>
    
    <canvas id="testCanvas" width="800" height="400"></canvas>

    <script type="module">
        import { GamePhase, ContentType } from './js/core/constants.js';
        import { ContentProvider } from './js/content/ContentProvider.js';
        import { InformationObject } from './js/core/InformationObject.js';

        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        function updateStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.style.borderColor = isError ? '#FF4444' : '#00FF41';
            statusDiv.style.backgroundColor = isError ? 'rgba(255, 68, 68, 0.1)' : 'rgba(0, 255, 65, 0.1)';
            statusDiv.style.color = isError ? '#FF4444' : '#00FF41';
            console.log(message);
        }

        window.enableDebug = function() {
            window.DEBUG_IMAGES = true;
            updateStatus('調試模式已啟用 - 圖片將顯示詳細資訊');
        };

        window.runQuickTest = async function() {
            updateStatus('🔄 開始快速測試...');
            
            try {
                // 1. 初始化 ContentProvider
                updateStatus('📄 初始化 ContentProvider...');
                const contentProvider = new ContentProvider();
                await contentProvider.loadContent();
                
                if (!contentProvider.isContentLoaded()) {
                    throw new Error('ContentProvider 載入失敗');
                }
                
                updateStatus('✅ ContentProvider 載入成功');
                
                // 2. 創建測試物件
                updateStatus('🖼️ 創建圖片物件...');
                
                // 清除畫布
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const testObjects = [];
                
                // 安全圖片
                const safeContent = contentProvider.getRandomContent(GamePhase.ART, false);
                const safeObj = new InformationObject(safeContent, 50, 50, 0);
                testObjects.push({ obj: safeObj, label: '安全圖片' });
                
                // 損壞圖片
                const corruptedContent = contentProvider.getRandomContent(GamePhase.ART, true);
                const corruptedObj = new InformationObject(corruptedContent, 350, 50, 0);
                testObjects.push({ obj: corruptedObj, label: '損壞圖片' });
                
                updateStatus('⏳ 等待圖片載入...');
                
                // 3. 渲染循環
                let checkCount = 0;
                const maxChecks = 50; // 5秒 (50 * 100ms)
                
                const checkInterval = setInterval(() => {
                    checkCount++;
                    
                    // 清除畫布
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 渲染物件
                    testObjects.forEach(({ obj, label }, index) => {
                        obj.render(ctx);
                        
                        // 添加標籤
                        ctx.fillStyle = '#00FF41';
                        ctx.font = '16px Courier New';
                        ctx.textAlign = 'left';
                        ctx.fillText(
                            `${label}: ${obj.imageLoaded ? '✅ 已載入' : '⏳ 載入中'}`,
                            obj.x,
                            obj.y - 20
                        );
                        
                        // 顯示圖片路徑
                        ctx.fillStyle = '#888';
                        ctx.font = '12px Courier New';
                        ctx.fillText(
                            obj.contentImage || '無路徑',
                            obj.x,
                            obj.y + obj.height + 15
                        );
                    });
                    
                    // 顯示進度
                    ctx.fillStyle = '#00BFFF';
                    ctx.font = '18px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(`檢查進度: ${checkCount}/${maxChecks}`, 10, 30);
                    
                    const loadedCount = testObjects.filter(({ obj }) => obj.imageLoaded).length;
                    ctx.fillText(`已載入: ${loadedCount}/${testObjects.length}`, 10, 55);
                    
                    // 檢查完成條件
                    if (loadedCount === testObjects.length || checkCount >= maxChecks) {
                        clearInterval(checkInterval);
                        
                        const finalLoadedCount = testObjects.filter(({ obj }) => obj.imageLoaded).length;
                        
                        if (finalLoadedCount === testObjects.length) {
                            updateStatus(`🎉 測試成功！所有 ${finalLoadedCount} 張圖片都已載入`);
                        } else if (finalLoadedCount > 0) {
                            updateStatus(`⚠️ 部分成功：${finalLoadedCount}/${testObjects.length} 張圖片載入`);
                        } else {
                            updateStatus('❌ 測試失敗：沒有圖片成功載入', true);
                        }
                        
                        // 顯示最終結果
                        ctx.fillStyle = finalLoadedCount > 0 ? '#00FF41' : '#FF4444';
                        ctx.font = '24px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText(
                            finalLoadedCount > 0 ? '測試通過！' : '測試失敗！',
                            canvas.width / 2,
                            canvas.height - 50
                        );
                    }
                }, 100);
                
            } catch (error) {
                updateStatus(`❌ 測試失敗: ${error.message}`, true);
                console.error('Test error:', error);
            }
        };

        // 初始化
        updateStatus('🚀 快速修復測試準備完成');
    </script>
</body>
</html>
