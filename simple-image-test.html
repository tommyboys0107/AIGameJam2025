<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Test</title>
    <style>
        body {
            background: #000;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .test-image {
            border: 2px solid #00BFFF;
            margin: 10px;
            max-width: 200px;
        }
        .error {
            color: #FF4444;
        }
        .success {
            color: #00FF41;
        }
    </style>
</head>
<body>
    <h1>Simple Image Loading Test</h1>
    
    <div id="results"></div>
    
    <h2>Direct HTML Image Tags</h2>
    <img src="assets/images/Safe1.jpg" class="test-image" onload="logSuccess('Safe1.jpg')" onerror="logError('Safe1.jpg')">
    <img src="assets/images/Corrupted1.jpg" class="test-image" onload="logSuccess('Corrupted1.jpg')" onerror="logError('Corrupted1.jpg')">
    
    <h2>JavaScript Image Loading</h2>
    <div id="js-test"></div>

    <script>
        const results = document.getElementById('results');
        const jsTest = document.getElementById('js-test');
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            console.log(message);
        }
        
        function logSuccess(imageName) {
            log(`✓ HTML img tag loaded: ${imageName}`);
        }
        
        function logError(imageName) {
            log(`✗ HTML img tag failed: ${imageName}`, true);
        }
        
        // Test JavaScript image loading
        const testImages = [
            'assets/images/Safe1.jpg',
            'assets/images/Safe2.jpg',
            'assets/images/Corrupted1.jpg',
            'assets/images/Corrupted2.jpg'
        ];
        
        testImages.forEach((imagePath, index) => {
            const img = new Image();
            
            img.onload = function() {
                log(`✓ JS Image loaded: ${imagePath} (${this.width}x${this.height})`);
                
                // Create canvas to test rendering
                const canvas = document.createElement('canvas');
                canvas.width = 150;
                canvas.height = 100;
                canvas.style.border = '1px solid #00BFFF';
                canvas.style.margin = '5px';
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(this, 0, 0, canvas.width, canvas.height);
                
                const label = document.createElement('div');
                label.textContent = imagePath;
                label.style.fontSize = '12px';
                
                jsTest.appendChild(canvas);
                jsTest.appendChild(label);
            };
            
            img.onerror = function() {
                log(`✗ JS Image failed: ${imagePath}`, true);
            };
            
            // Add timeout to detect hanging loads
            setTimeout(() => {
                if (!img.complete) {
                    log(`⚠ JS Image timeout: ${imagePath}`, true);
                }
            }, 5000);
            
            log(`Loading: ${imagePath}`);
            img.src = imagePath;
        });
    </script>
</body>
</html>
