<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #000000;
            color: #00FF41;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .test-button {
            background: linear-gradient(45deg, rgba(0, 191, 255, 0.3), rgba(0, 255, 65, 0.3));
            border: 3px solid #00BFFF;
            color: #00BFFF;
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 60px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-shadow: 0 0 15px #00BFFF;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.5);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            white-space: nowrap;
            min-width: fit-content;
            pointer-events: auto;
            z-index: 100;
        }
        
        .test-button:hover {
            background: linear-gradient(45deg, rgba(0, 191, 255, 0.5), rgba(0, 255, 65, 0.5));
            border-color: #00FF41;
            color: #00FF41;
            text-shadow: 0 0 20px #00FF41;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.7);
            transform: scale(1.1);
        }
        
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00FF41;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="status">Button test - click the button below</div>
    <button id="test-button" class="test-button">TEST BUTTON</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, setting up test button...');
            
            const testButton = document.getElementById('test-button');
            const status = document.getElementById('status');
            
            if (testButton) {
                console.log('Test button found, adding click handler');
                
                testButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    console.log('Test button clicked!');
                    status.textContent = 'Button clicked successfully!';
                    testButton.textContent = 'CLICKED!';
                });
                
                console.log('Test button click handler added successfully');
            } else {
                console.error('Test button not found!');
                status.textContent = 'ERROR: Button not found!';
            }
        });
    </script>
</body>
</html>
